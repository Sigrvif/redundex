[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redundex"
version = "0.3.4"
description = "Find redundant files: duplicates, resizes, re-encodes, contained clips"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
    "numpy>=1.26",
    "blake3>=1.0",
    "py7zr>=0.21",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]

[project.scripts]
redundex = "redundex.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["redundex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
